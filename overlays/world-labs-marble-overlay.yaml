    update:
      x-agent-guidance: >-
        Authenticate with the WLT-Api-Key header. worlds:generate returns an
        operation_id; poll GET /marble/v1/operations/{operation_id} until done
        is true (generations take about 5 minutes). Upload local media via
        media-assets:prepare_upload before generation. On 429 honor
        Retry-After with exponential backoff and jitter.
  - target: $.paths['/marble/v1/worlds:generate'].post
    update:
      x-long-running: true
      x-cost-credits: "150 (draft) to 1,500-3,000 (standard/plus) plus 0-100 pano generation, per https://docs.worldlabs.ai/api/pricing"
  - target: $.paths['/marble/v1/worlds/{world_id}:export'].post
    update:
      x-long-running: true
      x-cost-credits: "HQ mesh export 3,500; PLY splat export free"
