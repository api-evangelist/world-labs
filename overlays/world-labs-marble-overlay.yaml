x-method: generated
actions:
  - target: $.info
    update:
      x-apievangelist-provider: world-labs
      x-apievangelist-rating-notes: >-
        Spec published at https://docs.worldlabs.ai/api/reference/openapi.yaml.
        Strong schema coverage (46 component schemas, examples on request
        bodies); operationIds are FastAPI-generated (verbose); no 401/429
        responses declared even though the API enforces API-key auth and rate
        limits; errors use a detail-field envelope, not RFC 9457.
